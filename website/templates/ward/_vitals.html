<div class="vitals">
  {% for v in vitals %}
  <div class="vital{% if v.out %} out{% endif %}">
    <span class="label">{{ v.label }}</span>
    {% if v.value is not None %}
    <b>{{ v.value|floatformat:v.decimals }}<small>{{ v.unit }}</small></b>
    <span class="when">{{ v.time|date:"j M H:i" }}</span>
    {% else %}
    <b class="none">-</b>
    <span class="when">No reading</span>
    {% endif %}
  </div>
  {% endfor %}
</div>
